<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#0e0d0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>发展汉语 — Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Crimson Pro', Georgia, serif;
  background: #0e0d0b;
  color: #e8e2d9;
  min-height: 100dvh;
  overflow-x: hidden;
}

/* ── Light mode ── */
body.light { background: #f5efe3; color: #2a1e0a; }

/* ── App shell ── */
.app {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100dvh;
  padding-top: max(12px, env(safe-area-inset-top));
  padding-bottom: max(64px, calc(40px + env(safe-area-inset-bottom)));
  padding-left: 16px;
  padding-right: 16px;
  overflow-x: hidden;
}

/* ── Top bar ── */
.top-bar {
  width: 100%;
  max-width: 520px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 28px;
  flex-shrink: 0;
}

/* ── Mode switcher ── */
.mode-switcher {
  display: flex;
  gap: 4px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px;
  padding: 3px;
}
body.light .mode-switcher {
  background: rgba(0,0,0,0.04);
  border-color: rgba(0,0,0,0.1);
}
.mode-btn {
  font-family: 'Crimson Pro', Georgia, serif;
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 5px 14px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  transition: background 150ms, color 150ms;
  white-space: nowrap;
  min-height: 30px;
}
.mode-btn.active  { background: #c8b99a; color: #0e0d0b; }
.mode-btn.inactive { background: transparent; color: #6b5e45; }
.mode-btn.inactive:hover { color: #a89880; background: rgba(255,255,255,0.04); }
body.light .mode-btn.active   { background: #8a6040; color: #f5efe3; }
body.light .mode-btn.inactive { color: #b09070; }
body.light .mode-btn.inactive:hover { color: #3a1e00; background: rgba(0,0,0,0.04); }

/* ── Theme toggle ── */
.btn-mode {
  background: none;
  border: 1px solid rgba(200,185,154,0.25);
  color: #6b5e45;
  font-size: 14px;
  width: 32px;
  height: 32px;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  transition: border-color 0.2s, color 0.2s;
  flex-shrink: 0;
}
.btn-mode:hover { border-color: rgba(200,185,154,0.5); color: #c8b99a; }
body.light .btn-mode { border-color: rgba(100,70,40,0.3); color: #7a5830; }
body.light .btn-mode:hover { border-color: rgba(100,70,40,0.6); color: #3a1e00; }

/* ── Main content area ── */
#main-content {
  width: 100%;
  max-width: 520px;
  flex: 1;
}

/* ── Chapter selection ── */
.screen-title {
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #6b5e45;
  margin-bottom: 20px;
}
body.light .screen-title { color: #8a6040; }

.chapter-cards {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.chapter-card {
  width: 100%;
  background: rgba(255,255,255,0.02);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 6px;
  padding: 14px 18px;
  cursor: pointer;
  text-align: left;
  transition: border-color 0.15s, background 0.15s;
  min-height: 52px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.chapter-card:hover {
  border-color: rgba(168,152,128,0.35);
  background: rgba(255,255,255,0.04);
}
.chapter-card.selected {
  border-color: #a89880;
  background: rgba(168,152,128,0.08);
}
body.light .chapter-card {
  background: rgba(0,0,0,0.02);
  border-color: rgba(0,0,0,0.1);
}
body.light .chapter-card:hover {
  border-color: rgba(138,96,64,0.5);
  background: rgba(0,0,0,0.04);
}
body.light .chapter-card.selected {
  border-color: #8a6040;
  background: rgba(138,96,64,0.08);
}

.ch-num-badge {
  font-size: 10px;
  background: rgba(107,94,69,0.3);
  color: #7a6f5e;
  border-radius: 3px;
  padding: 2px 6px;
  min-width: 26px;
  text-align: center;
  flex-shrink: 0;
  letter-spacing: 0.05em;
}
body.light .ch-num-badge { background: rgba(100,70,40,0.12); color: #7a5030; }

.ch-card-inner { flex: 1; }
.ch-card-zh {
  font-family: 'Noto Serif JP', serif;
  font-size: 1.1rem;
  font-weight: 400;
  color: #c8b99a;
  line-height: 1.3;
}
body.light .ch-card-zh { color: #2a1e0a; }
.ch-card-en {
  font-style: italic;
  font-size: 0.9rem;
  color: #6b5e45;
  margin-top: 2px;
}
body.light .ch-card-en { color: #8a6040; }
.ch-card-count {
  font-size: 11px;
  color: #4a4030;
  flex-shrink: 0;
  white-space: nowrap;
}
body.light .ch-card-count { color: #9a8060; }

/* All chapters card special */
.chapter-card.all-card .ch-card-zh {
  color: #e8e2d9;
  font-weight: 300;
  font-family: 'Crimson Pro', Georgia, serif;
  font-size: 1rem;
  font-style: normal;
  letter-spacing: 0.05em;
}
body.light .chapter-card.all-card .ch-card-zh { color: #2a1e0a; }
.all-star {
  font-size: 16px;
  color: #a89880;
  flex-shrink: 0;
}
body.light .all-star { color: #8a6040; }

/* ── Drill selection ── */
.drill-cards {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 24px;
}

.drill-card {
  width: 100%;
  background: rgba(255,255,255,0.02);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 8px;
  padding: 18px 20px;
  cursor: pointer;
  text-align: left;
  transition: border-color 0.15s, background 0.15s;
  min-height: 52px;
}
.drill-card:hover {
  border-color: rgba(168,152,128,0.35);
  background: rgba(255,255,255,0.04);
}
.drill-card.selected {
  border-color: #a89880;
  background: rgba(168,152,128,0.08);
}
body.light .drill-card {
  background: rgba(0,0,0,0.02);
  border-color: rgba(0,0,0,0.1);
}
body.light .drill-card:hover {
  border-color: rgba(138,96,64,0.5);
  background: rgba(0,0,0,0.04);
}
body.light .drill-card.selected {
  border-color: #8a6040;
  background: rgba(138,96,64,0.08);
}
.drill-card-label {
  font-size: 1.05rem;
  color: #e8e2d9;
  margin-bottom: 4px;
}
body.light .drill-card-label { color: #1a0e00; }
.drill-card-desc {
  font-size: 0.88rem;
  color: #6b5e45;
  line-height: 1.4;
}
body.light .drill-card-desc { color: #8a6040; }

.round-length-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.round-length-label {
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #6b5e45;
  flex-shrink: 0;
}
body.light .round-length-label { color: #8a6040; }
.round-length-btns {
  display: flex;
  gap: 6px;
}
.btn-length {
  background: transparent;
  border: 1px solid rgba(200,185,154,0.25);
  color: #8a7f6e;
  font-family: 'Crimson Pro', Georgia, serif;
  font-size: 0.9rem;
  padding: 6px 16px;
  border-radius: 4px;
  cursor: pointer;
  transition: border-color 0.2s, color 0.2s, background 0.2s;
  min-height: 36px;
  min-width: 44px;
}
.btn-length:hover {
  border-color: rgba(200,185,154,0.5);
  color: #c8b99a;
}
.btn-length.active {
  border-color: #a89880;
  color: #e8e2d9;
  background: rgba(168,152,128,0.12);
}
body.light .btn-length { border-color: rgba(100,70,40,0.3); color: #7a5830; }
body.light .btn-length:hover { border-color: rgba(100,70,40,0.6); color: #3a1e00; }
body.light .btn-length.active { border-color: #8a6040; color: #1a0e00; background: rgba(138,96,64,0.1); }

.btn-start {
  width: 100%;
  height: 52px;
  background: #c8b99a;
  color: #0e0d0b;
  border: none;
  font-family: 'Crimson Pro', Georgia, serif;
  font-size: 1rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.2s;
  margin-bottom: 16px;
}
.btn-start:hover { background: #d8c9aa; }
.btn-start:disabled { background: #2a2820; color: #4a4030; cursor: default; }
body.light .btn-start { background: #8a6040; color: #f5efe3; }
body.light .btn-start:hover { background: #7a5030; }
body.light .btn-start:disabled { background: #d8d0c0; color: #9a9080; }

.back-link {
  display: inline-block;
  font-size: 0.88rem;
  color: #6b5e45;
  cursor: pointer;
  text-decoration: none;
  transition: color 0.15s;
  margin-bottom: 20px;
  background: none;
  border: none;
  font-family: 'Crimson Pro', Georgia, serif;
  padding: 0;
}
.back-link:hover { color: #a89880; }
body.light .back-link { color: #8a6040; }
body.light .back-link:hover { color: #3a1e00; }

.notice {
  font-size: 0.9rem;
  color: #6b5e45;
  padding: 14px 18px;
  border: 1px solid rgba(200,185,154,0.15);
  border-radius: 6px;
  line-height: 1.5;
  margin-bottom: 16px;
}
body.light .notice { color: #7a5030; border-color: rgba(100,70,40,0.2); }

/* ── Quiz card ── */
.quiz-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  font-size: 12px;
  letter-spacing: 0.08em;
  color: #6b5e45;
}
body.light .quiz-meta { color: #8a6040; }

.progress-bar-wrap {
  width: 100%;
  height: 2px;
  background: rgba(255,255,255,0.07);
  border-radius: 1px;
  margin-bottom: 28px;
  overflow: hidden;
}
body.light .progress-bar-wrap { background: rgba(0,0,0,0.1); }
.progress-bar-fill {
  height: 100%;
  background: #a89880;
  border-radius: 1px;
  transition: width 0.3s ease;
}
body.light .progress-bar-fill { background: #8a6040; }

.question-display {
  text-align: center;
  margin-bottom: 32px;
  min-height: 100px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.q-hanzi {
  font-family: 'Noto Serif JP', serif;
  font-size: min(14vw, 5rem);
  font-weight: 300;
  color: #f0ebe0;
  line-height: 1.15;
  word-break: keep-all;
}
body.light .q-hanzi { color: #1a0e00; }
.q-pinyin {
  font-family: 'Crimson Pro', Georgia, serif;
  font-size: 1.8rem;
  font-weight: 300;
  color: #a89880;
  letter-spacing: 0.02em;
  margin-bottom: 8px;
}
body.light .q-pinyin { color: #8a6040; }
.q-meaning {
  font-family: 'Crimson Pro', Georgia, serif;
  font-size: 1.1rem;
  color: #7a6f5e;
  font-style: italic;
}
body.light .q-meaning { color: #7a5030; }

.options {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.option-btn {
  width: 100%;
  background: rgba(255,255,255,0.02);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 6px;
  padding: 12px 16px;
  cursor: pointer;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: border-color 0.15s, background 0.15s;
  white-space: normal;
  word-break: break-word;
  min-height: 44px;
  font-family: 'Crimson Pro', Georgia, serif;
}
.option-btn:hover:not(:disabled) {
  border-color: rgba(168,152,128,0.35);
  background: rgba(255,255,255,0.04);
}
.option-btn:disabled { cursor: default; }
body.light .option-btn {
  background: rgba(0,0,0,0.02);
  border-color: rgba(0,0,0,0.1);
}
body.light .option-btn:hover:not(:disabled) {
  border-color: rgba(138,96,64,0.4);
  background: rgba(0,0,0,0.04);
}

.option-letter {
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: #6b5e45;
  flex-shrink: 0;
  width: 18px;
}
body.light .option-letter { color: #8a6040; }

.option-text-hanzi {
  font-family: 'Noto Serif JP', serif;
  font-size: 1.5rem;
  font-weight: 300;
  color: #e8e2d9;
  flex: 1;
  line-height: 1.3;
}
body.light .option-text-hanzi { color: #1a0e00; }

.option-text-reading {
  font-family: 'Crimson Pro', Georgia, serif;
  font-size: 1rem;
  color: #c8b99a;
  flex: 1;
  line-height: 1.4;
}
body.light .option-text-reading { color: #3a1e00; }

/* Flash states */
@media (prefers-reduced-motion: no-preference) {
  .option-btn.flash-correct {
    background: rgba(120,200,120,0.25) !important;
    border-color: rgba(120,200,120,0.5) !important;
    transition: none;
  }
  .option-btn.flash-wrong {
    background: rgba(200,80,80,0.25) !important;
    border-color: rgba(200,80,80,0.5) !important;
    transition: none;
  }
}
@media (prefers-reduced-motion: reduce) {
  .option-btn.flash-correct { background: rgba(120,200,120,0.2) !important; }
  .option-btn.flash-wrong   { background: rgba(200,80,80,0.2) !important; }
}

/* ── Results ── */
.results-wrap {
  text-align: center;
  padding: 40px 0 20px;
}
.results-title {
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #6b5e45;
  margin-bottom: 32px;
}
body.light .results-title { color: #8a6040; }
.results-score {
  font-family: 'Noto Serif JP', serif;
  font-size: 3.5rem;
  font-weight: 300;
  color: #f0ebe0;
  line-height: 1;
  margin-bottom: 12px;
}
body.light .results-score { color: #1a0e00; }
.results-pct {
  font-size: 1.2rem;
  color: #a89880;
  margin-bottom: 40px;
}
body.light .results-pct { color: #8a6040; }
.results-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: 300px;
  margin: 0 auto;
}
.btn-result {
  width: 100%;
  padding: 13px 20px;
  border-radius: 6px;
  font-family: 'Crimson Pro', Georgia, serif;
  font-size: 0.95rem;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s, color 0.2s;
  letter-spacing: 0.04em;
  min-height: 44px;
}
.btn-result.primary {
  background: #c8b99a;
  color: #0e0d0b;
  border: none;
}
.btn-result.primary:hover { background: #d8c9aa; }
.btn-result.ghost {
  background: transparent;
  border: 1px solid rgba(200,185,154,0.25);
  color: #8a7f6e;
}
.btn-result.ghost:hover {
  border-color: rgba(200,185,154,0.5);
  color: #c8b99a;
}
body.light .btn-result.primary { background: #8a6040; color: #f5efe3; }
body.light .btn-result.primary:hover { background: #7a5030; }
body.light .btn-result.ghost { border-color: rgba(100,70,40,0.3); color: #7a5830; }
body.light .btn-result.ghost:hover { border-color: rgba(100,70,40,0.6); color: #3a1e00; }

/* ── Divider ── */
.divider {
  height: 1px;
  background: rgba(255,255,255,0.05);
  margin: 16px 0;
}
body.light .divider { background: rgba(0,0,0,0.07); }

/* ── Mobile tweaks ── */
@media (max-width: 400px) {
  .q-hanzi { font-size: min(16vw, 4rem); }
  .q-pinyin { font-size: 1.5rem; }
  .option-text-hanzi { font-size: 1.25rem; }
  .option-btn { padding: 10px 12px; }
  .results-score { font-size: 2.8rem; }
  .top-bar { margin-bottom: 20px; }
}

/* ── Streak chip ── */
.streak-chip {
  display: flex;
  align-items: center;
  gap: 3px;
  font-family: 'Crimson Pro', Georgia, serif;
  font-size: 15px;
  line-height: 1;
  cursor: default;
  user-select: none;
  transition: opacity 200ms;
}
.streak-chip.zero { opacity: 0.35; }
.streak-flame { font-size: 16px; line-height: 1; }
.streak-count { font-size: 15px; font-weight: 400; color: #c8b99a; min-width: 14px; }
body.light .streak-count { color: #8a6040; }
@keyframes streak-pulse {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.4); }
  100% { transform: scale(1); }
}
.streak-chip.just-increased .streak-flame { animation: streak-pulse 500ms ease-out; }
@media (prefers-reduced-motion: reduce) {
  .streak-chip.just-increased .streak-flame { animation: none; }
}

/* ── Results streak line ── */
.results-streak {
  font-family: 'Crimson Pro', Georgia, serif;
  font-size: 1rem;
  color: #a89880;
  margin-top: 6px;
  margin-bottom: 24px;
  text-align: center;
}
.results-streak strong { color: #c8b99a; }
body.light .results-streak { color: #8a6040; }
body.light .results-streak strong { color: #6a3010; }
</style>

<body>
<div class="app">
  <!-- Top bar -->
  <div class="top-bar">
    <div class="mode-switcher">
      <a class="mode-btn inactive" href="./mandarin-vocab.html">Flashcards</a>
      <span class="mode-btn active">Quiz</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="streak-chip zero" id="streakChip" title="Current streak">
        <span class="streak-flame">🔥</span>
        <span class="streak-count" id="streakCount">0</span>
      </div>
      <button class="btn-mode" id="btnMode" onclick="toggleMode()" title="Toggle light/dark">☀</button>
    </div>
  </div>

  <!-- Dynamic content -->
  <div id="main-content"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  Vocabulary data
// ═══════════════════════════════════════════════════════════════
const CHAPTERS = [
  {
    num: 1, zh: "你好", en: "Hello",
    words: [
      { h:"你", p:"nǐ", pos:"pron.", m:"you", ex:"你好吗？", exm:"How are you?" },
      { h:"好", p:"hǎo", pos:"adj.", m:"good, well, ok", ex:"他汉语说得很好。", exm:"He speaks Chinese very well." },
      { h:"老师", p:"lǎoshī", pos:"n.", m:"teacher", ex:"我们老师是中国人。", exm:"Our teacher is Chinese." },
      { h:"您", p:"nín", pos:"pron.", m:"you (respectful form)", ex:"您贵姓？", exm:"May I ask your surname?" },
      { h:"你们", p:"nǐmen", pos:"pron.", m:"you (plural)", ex:"你们都是学生吗？", exm:"Are you all students?" },
      { h:"们", p:"men", pos:"suf.", m:"plural suffix for pronouns/people", ex:"同学们，上课了。", exm:"Students, class is starting." },
      { h:"再见", p:"zàijiàn", pos:"v.", m:"good-bye, see you again", ex:"明天见，再见！", exm:"See you tomorrow, goodbye!" },
    ]
  },
  {
    num: 2, zh: "谢谢", en: "Thank You",
    words: [
      { h:"早上", p:"zǎoshang", pos:"n.", m:"morning", ex:"早上我七点起床。", exm:"I get up at 7 in the morning." },

// ═══════════════════════════════════════════════════════════════
//  Streak
// ═══════════════════════════════════════════════════════════════
const LS_STREAK_CURRENT = 'mn-streak-current';
const LS_STREAK_BEST    = 'mn-streak-best';
const LS_STREAK_DATE    = 'mn-streak-date';

function lsGet(k) { try { return localStorage.getItem(k); } catch(e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch(e) {} }

function todayStr() {
  return new Date().toLocaleDateString('en-CA');
}

function getStreak() {
  return {
    current: parseInt(lsGet(LS_STREAK_CURRENT) || '0', 10),
    best:    parseInt(lsGet(LS_STREAK_BEST)    || '0', 10),
    date:    lsGet(LS_STREAK_DATE) || null,
  };
}

function recordActivity() {
  const today = todayStr();
  const s = getStreak();

  if (s.date === today) return { current: s.current, best: s.best, increased: false };

  let newCurrent;
  if (s.date === null) {
    newCurrent = 1;
  } else {
    const last = new Date(s.date);
    const now  = new Date(today);
    const diffDays = Math.round((now - last) / 86400000);
    newCurrent = (diffDays === 1) ? s.current + 1 : 1;
  }

  const newBest = Math.max(newCurrent, s.best);
  lsSet(LS_STREAK_CURRENT, String(newCurrent));
  lsSet(LS_STREAK_BEST,    String(newBest));
  lsSet(LS_STREAK_DATE,    today);

  return { current: newCurrent, best: newBest, increased: newCurrent > s.current };
}

function renderStreakChip() {
  const s = getStreak();
  const chip  = document.getElementById('streakChip');
  const count = document.getElementById('streakCount');
  if (!chip || !count) return;
  count.textContent = s.current;
  chip.classList.toggle('zero', s.current === 0);
}

// ═══════════════════════════════════════════════════════════════
//  Word pool helpers
// ═══════════════════════════════════════════════════════════════
function getPool() {
  if (state.chapterIdx === null) {
    return CHAPTERS.flatMap(ch => ch.words);
  }
  return CHAPTERS[state.chapterIdx].words;
}

function chapterLabel() {
  if (state.chapterIdx === null) return 'All Chapters';
  const ch = CHAPTERS[state.chapterIdx];
  return `Ch.${ch.num}`;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ═══════════════════════════════════════════════════════════════
//  Question generation
// ═══════════════════════════════════════════════════════════════
function buildQuestions() {
  const pool = getPool();
  const n = state.roundLength;
  const questions = [];

  for (let i = 0; i < n; i++) {
    const correct = pool[Math.floor(Math.random() * pool.length)];
    const distractors = [];
    const used = new Set([correct.h]);

    while (distractors.length < 3) {
      const candidate = pool[Math.floor(Math.random() * pool.length)];
      if (!used.has(candidate.h)) {
        used.add(candidate.h);
        distractors.push(candidate);
      }
    }

    const options = shuffle([
      { ...correct, isCorrect: true },
      { ...distractors[0], isCorrect: false },
      { ...distractors[1], isCorrect: false },
      { ...distractors[2], isCorrect: false },
    ]);

    questions.push({ word: correct, options });
  }

  return questions;
}

// ═══════════════════════════════════════════════════════════════
//  Render
// ═══════════════════════════════════════════════════════════════
function render() {
  const el = document.getElementById('main-content');
  switch (state.screen) {
    case 'chapter': el.innerHTML = renderChapterScreen(); break;
    case 'select':  el.innerHTML = renderSelectScreen();  break;
    case 'quiz':    el.innerHTML = renderQuizScreen();    break;
    case 'results': el.innerHTML = renderResultsScreen(); break;
  }
  attachHandlers();
}

// ── Screen 1: Chapter selection ──────────────────────────────
function renderChapterScreen() {
  const allCount = CHAPTERS.reduce((s, ch) => s + ch.words.length, 0);
  let html = `<p class="screen-title">Select a chapter</p><div class="chapter-cards">`;

  html += `<button class="chapter-card all-card" data-ch="all">
    <span class="all-star">★</span>
    <div class="ch-card-inner">
      <div class="ch-card-zh">All Chapters</div>
    </div>
    <span class="ch-card-count">${allCount} words</span>
  </button>`;

  CHAPTERS.forEach((ch, i) => {
    html += `<button class="chapter-card" data-ch="${i}">
      <span class="ch-num-badge">Ch.${ch.num}</span>
      <div class="ch-card-inner">
        <div class="ch-card-zh">${ch.zh}</div>
        <div class="ch-card-en">${ch.en}</div>
      </div>
      <span class="ch-card-count">${ch.words.length} words</span>
    </button>`;
  });

  html += `</div>`;
  return html;
}

// ── Screen 2: Drill selection ────────────────────────────────
function renderSelectScreen() {
  const pool = getPool();
  const tooFew = pool.length < 4;
  const chLabel = state.chapterIdx === null
    ? 'All Chapters'
    : `Ch.${CHAPTERS[state.chapterIdx].num} — ${CHAPTERS[state.chapterIdx].zh}`;

  const drills = [
    { id: 'hanzi-to-reading', label: 'Hanzi → Reading & Meaning', desc: 'See a Chinese character. Pick its pinyin + English meaning from 4 options.' },
    { id: 'reading-to-hanzi', label: 'Reading → Hanzi', desc: 'See the pinyin and English meaning. Pick the correct hanzi from 4 options.' },
  ];

  let html = `
    <button class="back-link" data-action="back-chapter">← Change chapter</button>
    <p class="screen-title">${chLabel} · ${pool.length} words</p>
    ${tooFew ? `<div class="notice">This chapter needs at least 4 words to generate a quiz. Please choose a different chapter.</div>` : ''}
    <div class="drill-cards">`;

  drills.forEach(d => {
    const sel = state.drillType === d.id ? ' selected' : '';
    html += `<button class="drill-card${sel}" data-drill="${d.id}" ${tooFew ? 'disabled' : ''}>
      <div class="drill-card-label">${d.label}</div>
      <div class="drill-card-desc">${d.desc}</div>
    </button>`;
  });

  html += `</div>
    <div class="round-length-row">
      <span class="round-length-label">Questions</span>
      <div class="round-length-btns">`;

  [5, 10, 20].forEach(n => {
    html += `<button class="btn-length${state.roundLength === n ? ' active' : ''}" data-len="${n}">${n}</button>`;
  });

  html += `</div></div>
    <button class="btn-start" data-action="start" ${tooFew || !state.drillType ? 'disabled' : ''}>Start</button>`;

  return html;
}

// ── Screen 3: Quiz card ──────────────────────────────────────
function renderQuizScreen() {
  const q = state.questions[state.currentIndex];
  const total = state.questions.length;
  const pct = ((state.currentIndex) / total) * 100;
  const letters = ['A', 'B', 'C', 'D'];

  let questionHtml = '';
  if (state.drillType === 'hanzi-to-reading') {
    questionHtml = `<div class="q-hanzi">${q.word.h}</div>`;
  } else {
    questionHtml = `<div class="q-pinyin">${q.word.p}</div><div class="q-meaning">${q.word.m}</div>`;
  }

  let optionsHtml = '';
  q.options.forEach((opt, i) => {
    let optContent = '';
    if (state.drillType === 'hanzi-to-reading') {
      optContent = `<span class="option-text-reading">${opt.p} &nbsp;·&nbsp; ${opt.m}</span>`;
    } else {
      optContent = `<span class="option-text-hanzi">${opt.h}</span>`;
    }
    optionsHtml += `<button class="option-btn" data-idx="${i}" ${state.answered ? 'disabled' : ''}>
      <span class="option-letter">${letters[i]}</span>
      ${optContent}
    </button>`;
  });

  return `
    <div class="quiz-meta">
      <span>${state.drillType === 'hanzi-to-reading' ? 'Hanzi → Reading' : 'Reading → Hanzi'} &nbsp;·&nbsp; ${chapterLabel()}</span>
      <span>${state.currentIndex + 1} / ${total}</span>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" style="width:${pct}%"></div>
    </div>
    <div class="question-display">${questionHtml}</div>
    <div class="options">${optionsHtml}</div>`;
}

// ── Screen 4: Results ────────────────────────────────────────
function renderResultsScreen() {
  const total = state.questions.length;
  const pct = Math.round((state.score / total) * 100);
  const s = getStreak();
  return `
    <div class="results-wrap">
      <p class="results-title">Results</p>
      <div class="results-score">${state.score} / ${total}</div>
      <div class="results-pct">${pct}% correct</div>
      <p class="results-streak">🔥 <strong>${s.current}</strong> day streak &nbsp;·&nbsp; Best: <strong>${s.best}</strong></p>
      <div class="results-actions">
        <button class="btn-result primary" data-action="retry">Try again — same drill</button>
        <button class="btn-result ghost" data-action="change-drill">Change drill</button>
        <button class="btn-result ghost" data-action="change-chapter">Change chapter</button>
      </div>
    </div>`;
}

// ═══════════════════════════════════════════════════════════════
//  Event handlers
// ═══════════════════════════════════════════════════════════════
function attachHandlers() {
  const el = document.getElementById('main-content');

  // Chapter cards
  el.querySelectorAll('[data-ch]').forEach(btn => {
    btn.addEventListener('click', () => {
      const val = btn.dataset.ch;
      state.chapterIdx = val === 'all' ? null : parseInt(val, 10);
      state.drillType = null;
      state.screen = 'select';
      render();
    });
  });

  // Drill cards
  el.querySelectorAll('[data-drill]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.drillType = btn.dataset.drill;
      render();
    });
  });

  // Round length
  el.querySelectorAll('[data-len]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.roundLength = parseInt(btn.dataset.len, 10);
      localStorage.setItem('mn-quiz-round-length', state.roundLength);
      render();
    });
  });

  // Start
  const startBtn = el.querySelector('[data-action="start"]');
  if (startBtn) {
    startBtn.addEventListener('click', () => {
      state.questions = buildQuestions();
      state.currentIndex = 0;
      state.score = 0;
      state.answered = false;
      state.screen = 'quiz';
      render();
    });
  }

  // Back to chapter
  const backChapter = el.querySelector('[data-action="back-chapter"]');
  if (backChapter) {
    backChapter.addEventListener('click', () => {
      state.screen = 'chapter';
      render();
    });
  }

  // Option buttons
  el.querySelectorAll('.option-btn').forEach((btn, i) => {
    btn.addEventListener('click', () => handleAnswer(i));
  });

  // Results actions
  const retryBtn = el.querySelector('[data-action="retry"]');
  if (retryBtn) {
    retryBtn.addEventListener('click', () => {
      state.questions = buildQuestions();
      state.currentIndex = 0;
      state.score = 0;
      state.answered = false;
      state.screen = 'quiz';
      render();
    });
  }
  const changeDrillBtn = el.querySelector('[data-action="change-drill"]');
  if (changeDrillBtn) {
    changeDrillBtn.addEventListener('click', () => {
      state.screen = 'select';
      render();
    });
  }
  const changeChapterBtn = el.querySelector('[data-action="change-chapter"]');
  if (changeChapterBtn) {
    changeChapterBtn.addEventListener('click', () => {
      state.screen = 'chapter';
      render();
    });
  }
}

// ═══════════════════════════════════════════════════════════════
//  Answer handling
// ═══════════════════════════════════════════════════════════════
function handleAnswer(idx) {
  if (state.answered) return;
  state.answered = true;

  const q = state.questions[state.currentIndex];
  const chosen = q.options[idx];
  const correct = chosen.isCorrect;

  if (correct) state.score++;

  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.setAttribute('disabled', ''));

  // Flash chosen
  btns[idx].classList.add(correct ? 'flash-correct' : 'flash-wrong');

  // If wrong, also flash the correct one
  if (!correct) {
    q.options.forEach((opt, i) => {
      if (opt.isCorrect) btns[i].classList.add('flash-correct');
    });
  }

  const delay = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 300 : 800;

  setTimeout(() => {
    state.currentIndex++;
    state.answered = false;
    if (state.currentIndex >= state.questions.length) {
      state.screen = 'results';
      const result = recordActivity();
      render();
      if (result && result.increased) {
        const chip = document.getElementById('streakChip');
        if (chip) {
          chip.classList.add('just-increased');
          setTimeout(() => chip.classList.remove('just-increased'), 600);
        }
      }
      renderStreakChip();
    } else {
      render();
    }
  }, delay);
}

// ═══════════════════════════════════════════════════════════════
//  Keyboard
// ═══════════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (state.screen !== 'quiz' || state.answered) return;
  const map = { a: 0, b: 1, c: 2, d: 3, A: 0, B: 1, C: 2, D: 3 };
  if (map[e.key] !== undefined) handleAnswer(map[e.key]);
});

// ═══════════════════════════════════════════════════════════════
//  Init
// ═══════════════════════════════════════════════════════════════
initTheme();
render();
renderStreakChip();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js')
      .catch(err => console.warn('SW registration failed:', err));
  });
}
</script>
</body>
</html>
